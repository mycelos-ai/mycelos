<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mycelos</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="/shared/tailwind-config.js"></script>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/home.css">
  <script src="/shared/api.js"></script>
  <script src="/shared/i18n.js"></script>
  <script src="/shared/layout.js"></script>
  <script src="/shared/home.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="mycelosApp()" class="home-surface">
  <div id="sidebar"></div>

  <main
    class="home-main"
    x-data="homeApp()"
    x-init="initHome()"
    @keydown.window="handleGlobalKeydown($event)"
  >
    <h1 class="home-sr-only" x-text="t('home.title')"></h1>
    <header class="home-command-region">
      <div class="home-omnibox-wrap">
        <div class="home-omnibox" :class="{ 'is-focused': barFocused, 'has-error': barError }">
          <span class="material-symbols-outlined home-search-icon" aria-hidden="true">search</span>
          <input
            x-ref="omnibox"
            x-model="query"
            type="text"
            autocomplete="off"
            :placeholder="t('home.omnibox_placeholder')"
            :aria-label="t('home.omnibox_label')"
            @focus="barFocused = true"
            @blur="barFocused = false"
            @input.debounce.250ms="searchQuery()"
            @keydown.enter.prevent="handleEnter($event)"
          >

          <div class="home-omnibox-actions" x-show="query.trim()" x-cloak>
            <button type="button" class="home-action-primary" @click="askQuery()" :disabled="answer.thinking">
              <span x-text="t('home.ask')"></span>
              <kbd>↵</kbd>
            </button>
            <button type="button" class="home-action-secondary" @click="keepQuery()" :disabled="capture.saving">
              <span x-text="t('home.keep')"></span>
              <kbd>⇧↵</kbd>
            </button>
          </div>

          <kbd class="home-command-key" x-show="!query.trim()" x-cloak>⌘ K</kbd>
        </div>

        <div class="home-match-hint" aria-live="polite">
          <span x-show="searching" x-text="t('home.searching')"></span>
          <span x-show="!searching && query.trim() && searchResults.length" x-text="matchHint()"></span>
          <span x-show="!searching && query.trim() && !searchResults.length && !barError" x-text="t('home.no_matches')"></span>
          <span x-show="barError" x-text="barError"></span>
        </div>

        <section class="home-answer" x-show="answer.open" x-cloak aria-live="polite">
          <div class="home-answer-head">
            <p x-text="answer.question"></p>
            <button type="button" class="home-icon-button" @click="closeAnswer()" :aria-label="t('common.close')">
              <span aria-hidden="true">×</span>
            </button>
          </div>

          <div class="home-thinking" x-show="answer.thinking" :aria-label="t('home.thinking')">
            <span></span><span></span><span></span>
          </div>

          <p class="home-answer-error" x-show="answer.error" x-text="answer.error"></p>
          <div class="home-answer-text" x-show="answer.text" x-text="answer.text"></div>

          <div class="home-citations" x-show="answer.citations.length">
            <p class="home-citations-label" x-text="t('home.related_notes')"></p>
            <div>
              <template x-for="citation in answer.citations" :key="citation.path">
                <a :href="noteHref(citation.path)" class="home-citation-chip">
                  <span class="material-symbols-outlined" aria-hidden="true">description</span>
                  <span x-text="citation.title"></span>
                </a>
              </template>
            </div>
          </div>

          <div class="home-answer-actions" x-show="answer.text">
            <button type="button" class="home-action-secondary" @click="keepAnswer()" :disabled="capture.saving">
              <span class="material-symbols-outlined" aria-hidden="true">add</span>
              <span x-text="t('home.keep_answer')"></span>
            </button>
            <a :href="converseHref()" x-text="t('home.continue_converse')"></a>
          </div>
        </section>
      </div>

      <div class="home-today" aria-live="polite">
        <strong x-text="t('home.today')"></strong>
        <template x-if="today.inboxCount > 0">
          <a href="/pages/inbox.html">
            <span class="home-signal-dot" aria-hidden="true"></span>
            <span x-text="inboxLabel()"></span>
          </a>
        </template>
        <template x-if="today.dueEntries.length > 0">
          <a :href="dueHref()">
            <span class="home-today-divider" aria-hidden="true">·</span>
            <span x-text="dueLabel()"></span>
          </a>
        </template>
        <span x-show="today.loaded && today.inboxCount === 0 && today.dueEntries.length === 0" x-text="t('home.today_clear')"></span>
        <span x-show="!today.loaded" x-text="t('home.today_loading')"></span>
      </div>
    </header>

    <section class="home-workspace" :aria-label="t('home.knowledge_map')">
      <div class="home-view-toggle" role="group" :aria-label="t('home.view_label')">
        <button type="button" @click="setMode('graph')" :class="{ active: mode === 'graph' }" :aria-pressed="mode === 'graph'">
          <span class="material-symbols-outlined" aria-hidden="true">hub</span>
          <span x-text="t('home.graph')"></span>
        </button>
        <button type="button" @click="setMode('tree')" :class="{ active: mode === 'tree' }" :aria-pressed="mode === 'tree'">
          <span class="material-symbols-outlined" aria-hidden="true">account_tree</span>
          <span x-text="t('home.tree')"></span>
        </button>
      </div>

      <div class="home-tree-pane" x-show="mode === 'tree'">
        <div class="home-loading" x-show="loading">
          <span class="home-loading-line"></span>
          <span class="home-loading-line"></span>
          <span class="home-loading-line"></span>
        </div>

        <div class="home-empty" x-show="!loading && graph.nodes.length === 0">
          <img src="/assets/logo-transparent.svg" alt="" aria-hidden="true">
          <h1 x-text="t('home.empty_title')"></h1>
          <p x-text="t('home.empty_body')"></p>
          <button type="button" class="home-action-primary" @click="focusBar()" x-text="t('home.empty_action')"></button>
        </div>

        <div class="home-empty home-empty-compact" x-show="!loading && graph.nodes.length > 0 && query.trim() && treeRows().length === 0">
          <span class="material-symbols-outlined" aria-hidden="true">search_off</span>
          <h2 x-text="t('home.no_matches_title')"></h2>
          <p x-text="t('home.no_matches_body')"></p>
        </div>

        <div class="home-tree" x-show="!loading && treeRows().length">
          <template x-for="row in treeRows()" :key="row.key">
            <div class="home-tree-row" :class="{ 'is-note': row.type !== 'topic', 'is-uncertain': row.uncertain }" :style="'--tree-depth:' + row.depth">
              <button
                type="button"
                class="home-tree-toggle"
                x-show="row.type === 'topic' && row.hasChildren"
                @click="toggleTopic(row.id)"
                :aria-label="expanded[row.id] ? t('home.collapse_topic') : t('home.expand_topic')"
                :aria-expanded="!!expanded[row.id]"
              >
                <span class="material-symbols-outlined" aria-hidden="true" x-text="expanded[row.id] ? 'expand_more' : 'chevron_right'"></span>
              </button>
              <span class="home-tree-spacer" x-show="row.type !== 'topic' || !row.hasChildren"></span>

              <button type="button" class="home-tree-main" @click="openRow(row)">
                <span class="material-symbols-outlined home-tree-type" aria-hidden="true" x-text="rowIcon(row)"></span>
                <span class="home-tree-title" x-text="row.title"></span>
                <span class="home-uncertain-mark" x-show="row.uncertain" :title="t('home.uncertain_placement')">?</span>
              </button>

              <span class="home-tree-count" x-show="row.type === 'topic'" x-text="row.count"></span>
            </div>
          </template>

          <button
            type="button"
            class="home-tree-more"
            x-show="!query.trim() && expanded.__unfiled__ && rootNotesRemaining() > 0"
            x-cloak
            @click="moreRootNotes()"
            x-text="moreRootNotesLabel()"
          ></button>
        </div>
      </div>

      <div class="home-graph-placeholder" x-show="mode === 'graph'" x-cloak>
        <div class="home-graph-orbit" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <h2 x-text="t('home.graph_next_title')"></h2>
        <p x-text="t('home.graph_next_body')"></p>
        <button type="button" class="home-action-secondary" @click="setMode('tree')" x-text="t('home.back_to_tree')"></button>
      </div>
    </section>

    <footer class="home-brain-state">
      <span>
        <span class="material-symbols-outlined" aria-hidden="true">neurology</span>
        <span x-text="brainStateLabel()"></span>
      </span>
      <span>
        <span class="home-state-dot" aria-hidden="true"></span>
        <span x-text="t('home.local_state')"></span>
      </span>
    </footer>

    <div class="home-toast" x-show="capture.message" x-transition x-cloak role="status">
      <span class="material-symbols-outlined" aria-hidden="true" x-text="capture.error ? 'error' : 'check_circle'"></span>
      <span x-text="capture.message"></span>
    </div>
  </main>

  <nav id="mobile-nav"></nav>
</body>
</html>
