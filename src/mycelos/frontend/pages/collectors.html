<!doctype html>
<!-- Local extension of the existing settings page: device identity, connection state, then source controls. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>myCelos</title><link rel="stylesheet" href="/shared/collectors.css"><script src="/shared/i18n.js"></script><script defer src="/shared/collectors.js"></script></head>
<body><header><a href="/pages/chat.html"><strong>myCelos</strong></a><a href="/pages/settings.html" data-i18n="collector_ui.back_to_settings"></a></header><main><h1 data-i18n="collector_ui.title"></h1><p data-i18n="collector_ui.intro"></p><section aria-labelledby="pair-heading"><h2 id="pair-heading" data-i18n="collector_ui.pair_title"></h2><p data-i18n="collector_ui.pair_hint"></p><form id="invite-form"><label for="server-url" data-i18n="collector_ui.server_url"></label><input id="server-url" type="url" required><button data-i18n="collector_ui.create_invitation"></button></form><div id="invitation-panel" hidden><label for="invitation" data-i18n="collector_ui.invitation"></label><textarea id="invitation" readonly rows="5" spellcheck="false"></textarea><p class="hint" data-i18n="collector_ui.invitation_hint"></p><button id="copy" class="secondary" data-i18n="collector_ui.copy_invitation"></button></div><details><summary data-i18n="collector_ui.server_identity"></summary><h3 data-i18n="collector_ui.fingerprint"></h3><output id="server-fingerprint"></output><h3 data-i18n="collector_ui.public_key"></h3><output id="server-key"></output></details></section><p id="error" role="alert" hidden></p><section aria-labelledby="devices-heading"><div class="section-heading"><h2 id="devices-heading" data-i18n="collector_ui.devices_title"></h2><button id="refresh" class="secondary" data-i18n="collector_ui.refresh"></button></div><div id="devices" aria-live="polite"><p data-i18n="collector_ui.devices_loading"></p></div></section><section id="original-panel" hidden><h2 data-i18n="collector_ui.original_title"></h2><p id="original-state" role="status"></p><pre id="original-content"></pre><button id="close-original" class="secondary" data-i18n="collector_ui.close_content"></button></section></main></body></html>
