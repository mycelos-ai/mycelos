<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>myCelos</title>
<link rel="icon" href="/assets/favicon.png">
<script src="/shared/i18n.js"></script>
<script defer src="/shared/local-sources.js?v=source-results-2"></script>
<script defer src="/shared/model-settings.js"></script>
<script defer src="/shared/telegram-settings.js"></script>
<script defer src="/shared/knowledge-connectors.js"></script>
<style>
:root{color-scheme:light;--surface:#fff;--on-surface:#233638;--on-surface-variant:#536568;--primary:#176366;--outline-variant:#dce6e4;--surface-container:#f4f8f7;--surface-container-low:#f7f9f8}*{box-sizing:border-box}body{margin:0;background:#f9fbfa;color:#233638;font:15px/1.5 system-ui,sans-serif}header{height:72px;background:white;border-bottom:1px solid #dce6e4;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1080px)/2))}header a{text-decoration:none;color:#17595c}header strong{font-size:23px;font-weight:650;letter-spacing:-.6px}main{max-width:1080px;margin:48px auto;padding:0 24px}h1{font-size:32px;letter-spacing:-.7px;font-weight:600;margin:0 0 28px}.layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:48px}nav{display:flex;flex-direction:column;gap:5px;align-self:start}nav a{padding:11px 14px;text-decoration:none;color:#536568;border-radius:8px}nav a[aria-current=page]{background:#e6f0ed;color:#164e51;font-weight:600}nav a:hover{background:#eef4f1}.panel{min-width:0;padding:26px;background:#fff;border:1px solid #dce6e4;border-radius:14px}footer{margin-top:28px;font-size:13px}a{color:#176366}summary{cursor:pointer}footer button{font:inherit;padding:9px 13px;color:#17595c;border:1px solid #b8cbcc;border-radius:8px;background:white;cursor:pointer}:focus-visible{outline:3px solid #4a9297;outline-offset:3px}@media(max-width:680px){header{padding:0 20px;height:64px}main{margin:28px auto;padding:0 16px}h1{font-size:28px;margin-bottom:18px}.layout{display:block}nav{flex-direction:row;overflow-x:auto;margin-bottom:20px;gap:2px}nav a{white-space:nowrap;padding:9px 12px}.panel{padding:18px}header strong{font-size:21px}}
</style>
<script defer src="/shared/notifications.js?v=1"></script>
</head>
<body>
<header><a href="/pages/chat.html"><strong>myCelos</strong></a><div style="display:flex;align-items:center;gap:12px"><mycelos-notifications></mycelos-notifications><a href="/pages/chat.html" data-i18n="settings_page.back_to_chat"></a></div></header>
<main><h1 data-i18n="settings_page.title"></h1><div class="layout"><nav data-i18n-aria="settings_page.sections">
<a href="#sources" data-i18n="settings_page.nav_sources"></a><a href="/pages/collectors.html" data-i18n="settings_page.nav_collectors"></a><a href="#models" data-i18n="settings_page.nav_models"></a><a href="#telegram">Telegram</a><a href="#connectors" data-i18n="settings_page.nav_connectors"></a><a href="#more" data-i18n="settings_page.nav_more"></a>
</nav><div><section class="panel" id="panel" data-i18n-aria="settings_page.title"></section><footer><div id="runtime" style="margin-bottom:16px"></div></footer></div></div></main>
<script>
const T=(key,vars)=>(typeof globalThis.t==='function'?globalThis.t('settings_page.'+key,vars):key);
document.title='myCelos · '+T('title');
const sections={sources:'mycelos-sources',models:'mycelos-models',telegram:'mycelos-telegram',connectors:'mycelos-connectors',more:'div'};
function showSection(){const key=location.hash.slice(1) in sections?location.hash.slice(1):'sources';document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});const element=document.createElement(sections[key]);element.setAttribute('embedded','');if(key==='more'){element.innerHTML='<h2 data-i18n="settings_page.more_title"></h2><p><a href="/pages/workflows.html" data-i18n="settings_page.routines"></a> – <span data-i18n="settings_page.routines_hint"></span></p><p><a href="/pages/account-settings.html" data-i18n="settings_page.language"></a></p><p><a href="/pages/doctor.html" data-i18n="settings_page.doctor"></a></p><details><summary data-i18n="settings_page.advanced"></summary><p><a href="/pages/system-advanced.html" data-i18n="settings_page.system_history"></a></p><p><a href="/pages/agents.html" data-i18n="settings_page.agents"></a></p><p><a href="/pages/connectors-advanced.html" data-i18n="settings_page.connectors_advanced"></a></p></details><p><a href="/pages/docs.html" data-i18n="settings_page.help"></a> · <a href="/pages/about.html" data-i18n="settings_page.about"></a></p>';if(window.applyTranslations)window.applyTranslations(element);}document.getElementById('panel').replaceChildren(element);}
window.addEventListener('hashchange',showSection);showSection();
async function runtimeStatus(){
  try{
    const response=await fetch('/api/health');if(!response.ok)return;
    const health=await response.json();const runtime=document.getElementById('runtime');
    if(health.scheduler){runtime.textContent=T('automation_active');return;}
    runtime.innerHTML='<details><summary data-i18n="settings_page.automation_paused"></summary><p data-i18n="settings_page.automation_hint"></p><button type="button" id="start-automation" data-i18n="settings_page.automation_start"></button><p id="runtime-error" role="alert"></p></details>';if(window.applyTranslations)window.applyTranslations(runtime);
    document.getElementById('start-automation').onclick=async event=>{
      const button=event.target;button.disabled=true;button.textContent=T('automation_starting');
      try{const result=await fetch('/api/system/scheduler/start',{method:'POST'});if(!result.ok)throw new Error();await runtimeStatus();}
      catch{document.getElementById('runtime-error').textContent=T('automation_error');button.disabled=false;button.textContent=T('automation_start');}
    };
  }catch{}
}
runtimeStatus();
</script>
</body></html>
