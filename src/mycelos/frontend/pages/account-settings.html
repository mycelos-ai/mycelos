<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mycelos - Preferences</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared/vendor/material-symbols/material-symbols.css">
  <link rel="stylesheet" href="/shared/base.css">
  <script src="/shared/api.js"></script>
  <script src="/shared/i18n.js"></script>
  <script src="/shared/layout.js"></script>
  <script defer src="/shared/vendor/alpinejs-3.17.5.min.js"></script>
<link rel="stylesheet" href="/shared/product-shell.css?v=1">
<script defer src="/shared/notifications.js?v=1"></script>
  <!-- Tailwind last in <head>, where the old CDN script injected its styles,
       so utilities keep winning over base.css and page styles. -->
  <link rel="stylesheet" href="/shared/vendor/tailwind.css">
</head>
<body x-data="mycelosApp()" class="bg-[var(--surface)] text-[var(--on-surface)] font-body overflow-hidden h-screen flex">

  <!-- Sidebar container (loaded by layout.js) -->
  <div id="sidebar"></div>
  <div id="quick-capture"></div>

  <!-- Main content -->
  <main class="flex-1 flex flex-col md:pl-[170px] min-w-0">

    <!-- Header container (loaded by layout.js) -->
    <div id="header"></div>

    <!-- Preferences content -->
    <section
      class="flex-1 overflow-y-auto pt-20 pb-24 px-6 md:px-10"
      x-data="{
        language: 'en',
        loading: true,
        error: null,

        async init() {
          // Load each section independently so one failure doesn't block all
          const safe = async (fn) => { try { return await fn(); } catch { return null; } };

          const [langData] = await Promise.all([
            safe(() => MycelosAPI.get('/api/language')),
          ]);
          // Reflect the persisted language so the selector isn't stuck on 'en'.
          if (langData && langData.language) this.language = langData.language;
          this.loading = false;
        },
      }"
    >

      <!-- Loading state -->
      <div x-show="loading" class="flex items-center justify-center h-64">
        <div class="flex items-center gap-3 text-[var(--on-surface-variant)]">
          <div class="w-1.5 h-1.5 bg-[var(--primary)] rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
          <div class="w-1.5 h-1.5 bg-[var(--primary)] rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
          <div class="w-1.5 h-1.5 bg-[var(--primary)] rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
        </div>
      </div>

      <!-- Error state -->
      <div x-show="error && !loading" class="card max-w-md mx-auto mt-12 text-center">
        <span class="material-symbols-outlined text-[var(--error)] text-3xl mb-3">error_outline</span>
        <p class="text-sm text-[var(--on-surface-variant)]" x-text="'Connection failed: ' + error"></p>
        <button class="btn-secondary mt-4" @click="loading = true; error = null; init()" x-text="t('common.retry')">Retry</button>
      </div>

      <!-- Preferences sections -->
      <div x-show="!loading && !error" class="animate-fade-in max-w-5xl mx-auto space-y-10">

        <!-- Page heading -->
        <div>
          <h1 class="font-headline text-2xl font-bold tracking-tight" x-text="t('preferences.title')">Preferences</h1>
          <p class="text-[11px] text-[var(--on-surface-variant)] mt-1" x-text="t('preferences.subtitle')">Language and appearance for your account</p>
        </div>

        <!-- ============================================================ -->
        <!-- Section: Language -->
        <!-- ============================================================ -->
        <div>
          <h2 class="font-headline text-lg font-bold tracking-tight mb-1" x-text="t('settings.language')">Language</h2>
          <p class="text-[10px] text-[var(--on-surface-variant)] uppercase tracking-widest font-label mb-4">Interface Language</p>

          <div class="card max-w-sm" x-data="{ langSaved: false }">
            <label class="text-[10px] text-[var(--on-surface-variant)] uppercase tracking-widest font-label block mb-1.5">Preferred Language</label>
            <select
              class="input-field"
              x-model="language"
              @change="
                MycelosAPI.post('/api/language', { language: language })
                  .then(() => { langSaved = true; setTimeout(() => langSaved = false, 2500); })
                  .catch(() => {})
              "
            >
              <option value="en">English</option>
              <option value="de">Deutsch</option>
            </select>
            <p class="text-[10px] text-[var(--on-surface-variant)] mt-2" x-text="t('settings.language_hint')">Applies to the interface, LLM responses, and voice transcription. Reload to see the interface translated.</p>
            <p x-show="langSaved" class="text-[10px] text-[var(--primary)] mt-1" x-text="t('common.saved')">Saved</p>
          </div>
        </div>


      </div>
    </section>

  </main>

  <!-- Mobile navigation container (loaded by layout.js) -->
  <nav id="mobile-nav"></nav>



</body>
</html>
