<aside
  class="brain-sidebar fixed left-0 top-0 h-full w-[170px] z-40 hidden md:flex"
  x-data="sidebarData()"
  x-init="loadSidebar()"
>
  <a href="/pages/dashboard.html" class="brain-brand">
    <img alt="" aria-hidden="true" src="/assets/logo-transparent.svg">
    <span>mycelos</span>
  </a>

  <nav class="brain-nav" :aria-label="t('sidebar.main_navigation')">
    <a
      href="/pages/dashboard.html"
      class="brain-nav-item"
      :class="surfaceActive(activePage, 'brain') ? 'active' : ''"
      :aria-current="surfaceActive(activePage, 'brain') ? 'page' : null"
    >
      <span class="material-symbols-outlined" aria-hidden="true">neurology</span>
      <span x-text="t('sidebar.brain')"></span>
    </a>

    <a
      href="/pages/inbox.html"
      class="brain-nav-item"
      :class="surfaceActive(activePage, 'inbox') ? 'active' : ''"
      :aria-current="surfaceActive(activePage, 'inbox') ? 'page' : null"
    >
      <span class="material-symbols-outlined" aria-hidden="true">inbox</span>
      <span x-text="t('sidebar.inbox')"></span>
      <span class="brain-nav-badge" x-show="inboxCount > 0" x-text="inboxCount" x-cloak></span>
    </a>

    <a
      href="/pages/workflows.html"
      class="brain-nav-item"
      :class="surfaceActive(activePage, 'routines') ? 'active' : ''"
      :aria-current="surfaceActive(activePage, 'routines') ? 'page' : null"
    >
      <span class="material-symbols-outlined" aria-hidden="true">autorenew</span>
      <span x-text="t('sidebar.routines')"></span>
    </a>

    <a
      href="/pages/chat.html"
      class="brain-nav-item"
      :class="surfaceActive(activePage, 'converse') ? 'active' : ''"
      :aria-current="surfaceActive(activePage, 'converse') ? 'page' : null"
    >
      <span class="material-symbols-outlined" aria-hidden="true">forum</span>
      <span x-text="t('sidebar.converse')"></span>
    </a>

    <div class="brain-nav-spacer"></div>

    <a
      href="/pages/settings.html"
      class="brain-nav-item brain-system-item"
      :class="surfaceActive(activePage, 'system') ? 'active' : ''"
      :aria-current="surfaceActive(activePage, 'system') ? 'page' : null"
    >
      <span class="material-symbols-outlined" aria-hidden="true">settings</span>
      <span x-text="t('sidebar.system')"></span>
    </a>
  </nav>
</aside>
