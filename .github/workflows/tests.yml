name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # Don't try to checkout embedded repos (insp/)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          MYCELOS_MASTER_KEY: "ci-test-key-not-real"
        run: |
          python -m pytest tests/ --ignore=tests/integration --ignore=tests/e2e --ignore=tests/security -x --tb=short -q

      - name: Run security tests
        env:
          MYCELOS_MASTER_KEY: "ci-test-key-not-real"
        run: |
          python -m pytest tests/security/ -v --tb=short

      - name: Validate docker-compose.yml
        env:
          MYCELOS_PROXY_TOKEN: "ci-token-not-real"
          MYCELOS_DATA_DIR: "/tmp/fake-data"
        run: |
          mkdir -p /tmp/fake-data
          touch /tmp/fake-data/.master_key /tmp/fake-data/mycelos.db
          docker compose -f docker-compose.yml config > /dev/null
          echo "compose parse OK"

  tailwind:
    # The Web UI ships a precompiled Tailwind stylesheet (no CDN). Fail when
    # someone adds classes without rebuilding it via scripts/build-tailwind.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild Tailwind CSS
        run: scripts/build-tailwind.sh

      - name: Check the committed CSS is up to date
        run: |
          if ! git diff --exit-code -- src/mycelos/frontend/shared/vendor/tailwind.css; then
            echo "::error::tailwind.css is out of date. Run scripts/build-tailwind.sh and commit the result."
            exit 1
          fi
